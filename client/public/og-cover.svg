<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="45%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <radialGradient id="glow-orange" cx="20%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-violet" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glass-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <circle cx="180" cy="140" r="380" fill="url(#glow-orange)"/>
  <circle cx="1020" cy="490" r="400" fill="url(#glow-violet)"/>

  <rect x="50" y="50" width="1100" height="530" rx="28" fill="#111622" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.5" filter="url(#glass-shadow)"/>
  <rect x="50" y="50" width="1100" height="530" rx="28" fill="none" stroke="url(#brand-grad)" stroke-width="1" stroke-opacity="0.4"/>
  <rect x="100" y="50" width="1000" height="3" fill="url(#brand-grad)" rx="1.5"/>

  <g transform="translate(90, 95)">
    <rect width="48" height="48" rx="14" fill="url(#brand-grad)"/>
    <text x="24" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">SS</text>
    <text x="64" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="-0.8">supersec</text>
    <text x="64" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#94a3b8" letter-spacing="2">CLASS MANAGEMENT SYSTEM</text>

    <g transform="translate(730, 4)">
      <rect width="180" height="40" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="20" cy="20" r="4" fill="#f97316"/>
      <text x="100" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#f97316" text-anchor="middle" letter-spacing="1">STUDENT PORTAL</text>
    </g>
  </g>

  <line x1="90" y1="168" x2="1110" y2="168" stroke="#1e293b" stroke-width="1.5"/>

  <g transform="translate(90, 240)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#f8fafc" letter-spacing="-1.5">Class Secretary &amp; Student Portal</text>
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#94a3b8" letter-spacing="-0.2">Live roll call, Zoom attendance proof, official class updates &amp; resources.</text>
  </g>

  <g transform="translate(90, 500)">
    <circle cx="6" cy="0" r="4" fill="#10b981"/>
    <text x="18" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#64748b">Verified &amp; published by Class Secretary · Instant updates</text>
    <text x="1020" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#64748b" text-anchor="end" letter-spacing="0.5">supersec · Class Management</text>
  </g>
