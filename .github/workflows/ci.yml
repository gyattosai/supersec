name: CI

on:
  push:
    branches: [ v2, main ]
  pull_request:
    branches: [ v2, main ]

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js 20+
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Run isolated tests (Zero-DB guarantee)
        run: pnpm test

      - name: Production build
        run: pnpm build
        env:
          DATABASE_URI: mongodb://127.0.0.1:27017/ci_build_dummy
          PAYLOAD_SECRET: supersec-ci-build-mock-secret-at-least-32-chars-long
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
